<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель реєстрації</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>Реєстрація</h2>
        <form id="registrationForm">
            
            <!-- Поле Ім'я -->
            <div class="form-group">
                <label for="firstName">Ім'я:</label>
                <input type="text" id="firstName" placeholder="Введіть ім'я">
                <span class="error-message" id="firstNameError"></span>
            </div>

            <!-- Поле Прізвище -->
            <div class="form-group">
                <label for="lastName">Прізвище:</label>
                <input type="text" id="lastName" placeholder="Введіть прізвище">
                <span class="error-message" id="lastNameError"></span>
            </div>

            <!-- Поле Електронна пошта -->
            <div class="form-group">
                <label for="email">Електронна пошта:</label>
                <input type="email" id="email" placeholder="example@example.com">
                <span class="error-message" id="emailError"></span>
            </div>

            <!-- Поле Пароль -->
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" placeholder="Мінімум 8 символів">
                <span class="error-message" id="passwordError"></span>
            </div>

            <!-- Чекбокс показу пароля -->
            <div class="checkbox-group">
                <input type="checkbox" id="showPassword">
                <label for="showPassword">Показати пароль</label>
            </div>

            <!-- Кнопка відправки -->
            <button type="submit" id="submitBtn" disabled>Відправити</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
